name: DevXray CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Compile and Lint
      run: npm run pretest

    - name: Run Tests
      # Headless display setup for VS Code tests on Linux
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          xvfb-run -a npm test
        else
          npm test
        fi
